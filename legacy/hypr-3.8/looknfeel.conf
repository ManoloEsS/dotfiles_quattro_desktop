# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
    # No gaps between windows or borders
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 3

    # col.active_border = rgba(bb9af7ee) rgba(9d7cd8ee) 45deg # Change to niri-like side-scrolling layout
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # test color highlighting: rgba(51, 204, 255, 238) rgba(0, 255, 153, 238)
    layout = scrolling
}
# ===============================
# MASTER LAYOUT (workspace 9)
# ===============================
master {
    allow_small_split = false
    special_scale_factor = 1.0
    mfact = 0.7

    new_status = slave
    new_on_top = false
    new_on_active = none

    orientation = right
    slave_count_for_center_master = 2
    center_master_fallback = left

    smart_resizing = true
    drop_at_cursor = true
    always_keep_position = false
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 0

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
    blur {
        enabled = true
        size = 5
        ignore_opacity = true
        passes = 1
        special = true
        brightness = 0.9
        contrast = 0.75
        noise = 0.01
        vibrancy = 0.1696
    }

}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
    animation = borderangle, 1, 64, linear, loop
}

# https://wiki.hypr.land/Configuring/Variables/#layout                                       
layout {

    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

scrolling {
    column_width = 0.5
    explicit_column_widths = 0.30, 0.5, 0.70, 1.0
}
